<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ibarura — Shop</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">Ibarura</a>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Search products..." />
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Welcome to Ibarura</h1>
      <p>Starter e‑commerce site — client side only. Search works without backend.</p>
    </section>

    <section>
      <h2>Products</h2>
      <div id="productContainer" class="grid"></div>
      <div id="noResults" class="no-results" style="display:none;">No products found.</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© Ibarura — Static demo</small>
    </div>
  </footer>

  <script src="./assets/js/main.js"></script>
</body>
</html>
